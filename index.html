<style>
:root{
  --paper:#f7f3e8; --ink:#242a35; --gold:#c9a35c; --red:#b0342a; --red-d:#8c2820;
  --line:#e4dcc8; --card:#fffdf7; --green:#2e7d4f; --green-bg:#e6f4ec; --orange:#b06a1b; --orange-bg:#fdf1df;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:linear-gradient(160deg,#23222a 0%,#332b2b 70%,#402c1f 100%);color:#f5ead2;padding:18px 16px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
h1 .mark{font-size:14px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;letter-spacing:1px}
.sub{font-size:12px;color:#cbb98f;margin:2px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:0}
.tab{flex:1;min-width:96px;text-align:center;background:rgba(255,255,255,.06);color:#e8d9b8;border:1px solid rgba(201,163,92,.35);border-bottom:none;border-radius:10px 10px 0 0;padding:9px 6px 8px;cursor:pointer;font-size:14px;transition:all .15s}
.tab small{display:block;font-size:10px;color:#9c8c68;letter-spacing:1px}
.tab.on{background:var(--paper);color:var(--ink);font-weight:700;border-color:var(--paper)}
.controls{background:var(--paper);padding:10px 16px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input[type=text]{flex:1;min-width:140px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.controls button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.controls button.on{background:var(--red);border-color:var(--red);color:#fff}
.controls button.mini{padding:7px 8px}
.nowbar{background:#23362c;color:#cfe9da;font-size:13px;padding:8px 16px;display:none}
.nowbar b{color:#7fd6a4}
.nowbar .tm{color:#9db8a8}
.nowbar .t{background:#2e7d4f;border-radius:4px;padding:1px 7px;margin:1px 3px;display:inline-block;color:#fff}
.nowbar .soon{background:#5d4a2a;border-radius:4px;padding:1px 7px;margin:1px 3px;display:inline-block;color:#f3d9a5}
main{max-width:760px;margin:0 auto;padding:12px 12px 30px}
.venue{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(60,40,10,.06)}
.venue-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(90deg,#efe5cd,#f8f2e2);border-bottom:1px solid var(--line)}
.venue-head .vname{font-weight:700;font-size:15px;color:#5a4218;letter-spacing:1px}
.venue-head .cnt{font-size:11px;color:#8a7343;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px dashed #eee5d2;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row.off{opacity:.45}
.row.off .nm{text-decoration:line-through}
.nm{flex:1;min-width:140px;font-size:14.5px;font-weight:600;color:#33302a}
.nm .star{color:#d99e2b;margin-right:2px}
.nm .book{font-size:10px;color:#fff;background:var(--red);border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px;font-weight:400}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;background:#f0ead9;color:#4a4231;border-radius:5px;padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.tbd{background:#fdeedd;color:#b06a1b}
.chip.off{background:#eee;color:#999}
.chip.now{background:var(--green);color:#fff;font-weight:700;animation:pl 1.6s infinite}
.chip.soon{background:var(--orange-bg);color:var(--orange)}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(46,125,79,.5)}50%{box-shadow:0 0 0 5px rgba(46,125,79,0)}}
.meta{font-size:11.5px;color:#9a8d72;flex-basis:100%;margin-top:-2px;padding-left:2px}
.hour{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.hour-head{background:linear-gradient(90deg,#33291b,#4a3b24);color:#e9d9b2;padding:8px 12px;font-weight:700;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
.hour-head .hcnt{font-size:11px;color:#a8966d;letter-spacing:0}
.hour .row .ven{font-size:11px;color:#8a7343;background:#f3ecd9;border-radius:4px;padding:1px 6px;white-space:nowrap}
.area-title{font-size:14px;color:#5a4218;letter-spacing:3px;margin:2px 2px 10px;display:flex;align-items:center;gap:8px}
.area-title::before{content:"";flex:0 0 4px;height:18px;background:var(--red);border-radius:2px}
.empty{padding:40px 16px;text-align:center;color:#9a8d72;font-size:14px}
footer{max-width:760px;margin:0 auto;padding:6px 16px 40px;font-size:12px;color:#8a7c5f;text-align:center}
footer b{color:#6a5a3c}
.goto-now{position:fixed;right:14px;bottom:18px;background:var(--red);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(140,40,32,.45);cursor:pointer;z-index:60;display:none;line-height:1.2;padding:0}
body.photo header,body.photo .controls,body.photo .nowbar,body.photo .goto-now,body.photo footer{display:none!important}
.ptitle{text-align:center;padding:20px 0 6px}
.ptitle .p1{font-size:20px;font-weight:700;letter-spacing:3px;color:#3a2d17}
.ptitle .p2{font-size:13px;color:#8a7343;margin-top:5px;letter-spacing:2px}
/* 地点查询：当前节目+下一场 */
.loccard{background:var(--card);border:2px solid var(--gold);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(60,40,10,.12)}
.lchead{background:linear-gradient(90deg,#33291b,#4a3b24);color:#e9d9b2;padding:10px 14px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.lchead .lcven{background:rgba(255,255,255,.12);border:1px solid rgba(201,163,92,.6);border-radius:5px;padding:2px 8px;font-size:12px;color:#f3d9a5;letter-spacing:1px}
.lcnow,.lcnext{padding:12px 14px;border-bottom:1px dashed #eee5d2}
.lcnext{border-bottom:none}
.lcnow{background:var(--green-bg)}
.lcnow .lc-n{color:#1d5c38}
.lcnext{background:var(--orange-bg)}
.lcnext .lc-n{color:#7c4c14}
.lcnow.idle,.lcnext.idle{background:#f4f4f1}
.lcnow.idle .lc-n,.lcnext.idle .lc-n{color:#9a9a90}
.lc-l{font-size:11px;letter-spacing:3px;color:#9a8d72;font-weight:700}
.lc-n{font-size:19px;font-weight:800;margin:3px 0;letter-spacing:1px}
.lc-m{font-size:13px;color:#6a5c41}
.bar{height:6px;background:#d5e8db;border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.pg-h{font-size:13px;font-weight:700;color:#5a4218;letter-spacing:2px;margin:12px 2px 6px}
.pg{display:flex;flex-wrap:wrap;gap:6px}
.pv{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink);cursor:pointer}
.pv.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.hint{background:var(--card);border:1px dashed var(--gold);border-radius:12px;padding:16px;text-align:center;color:#8a7343;font-size:14px;margin-bottom:14px}
.lbl{font-size:10px;border-radius:3px;padding:1px 5px;margin-left:3px;font-weight:700}
.lbl.now{background:var(--green);color:#fff}
.lbl.next{background:var(--orange-bg);color:var(--orange);border:1px solid #e8c892}
/* 区域实况 */
.areabar{background:linear-gradient(90deg,#33291b,#4a3b24);color:#e9d9b2;padding:10px 14px;border-radius:12px;font-weight:700;font-size:16px;letter-spacing:2px;margin:4px 0 10px;text-align:center}
.ac{background:var(--green-bg);border:1px solid #bfe0cd;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.ac .ac-n{font-size:16px;font-weight:800;color:#1d5c38;letter-spacing:1px}
.ac .ac-m{font-size:12.5px;color:#4a7a5c;margin:2px 0 6px}
.rec{background:var(--orange-bg);border:2px solid #e2b96e;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rec .rc-l{font-size:11px;letter-spacing:2px;color:#8a5a12;font-weight:700}
.rec .rc-n{font-size:19px;font-weight:800;color:#7c4c14;margin:4px 0}
.rec .rc-m{font-size:13.5px;color:#8a6426}
@media (max-width:480px){.nm{font-size:14px}.chip{font-size:12px}}
</style>
</head>

    <input type="text" id="q" placeholder="🔍 搜节目或地点…">
    <button id="bView" onclick="toggleView()" style="display:none">📅 时间轴</button>
    <button id="bOff" class="on" onclick="toggleOff()">隐藏停演</button>
    <button id="bStar" onclick="toggleStar()">只看★</button>
  </div>
  <div class="nowbar" id="nowbar"></div>
</header>
<main id="main"></main>
<button class="goto-now" id="bNow" onclick="scrollNow()">现在<br>进行中</button>

/* ============ 逻辑 ============ */
var cur=0, view="venue", hideOff=true, starOnly=false;
var NOW=new Date();
function pad(n){return (n<10?"0":"")+n}
function t2m(s){var m=/^(\d{1,2}):(\d{2})/.exec(s);return m?(+m[1]*60+(+m[2])):null}
function firstTime(sh){if(sh.o)return null;var best=null;sh.ts.forEach(function(t){var m=t2m(t);if(m!=null&&(best==null||m<best))best=m});return best}
function isTBD(t){return t.indexOf("待定")>=0}
function showChips(sh,marks){
  if(sh.o)return '<span class="chip off">今日停演</span>';
  var html='';
  sh.ts.forEach(function(t){
    var cls="chip";if(isTBD(t))cls+=" tbd";
    var st=t2m(t),en=st==null?null:st+sh.m;
    if(qs.photo!="1"&&st!=null&&en!=null){
      var nm=NOW.getHours()*60+NOW.getMinutes();
      if(nm>=st&&nm<en)cls+=" now";else if(nm<st&&st-nm<=30)cls+=" soon";
    }
    var lab='';
    if(marks){if(marks.now==st)lab='<span class="lbl now">现在</span>';else if(marks.next==st)lab='<span class="lbl next">下一场</span>';}
    html+='<span class="'+cls+'">'+t+lab+'</span>';
  });
  return html;
}
function rowHtml(sh,ven,marks){
  var star=sh.s?'<span class="star">★</span>':'';
  var book=sh.b?'<span class="book">需预约</span>':'';
  return '<div class="row'+(sh.o?" off":"")+'">'+
    '<div class="nm">'+star+esc(sh.n)+book+'</div>'+
    '<div class="chips">'+showChips(sh,marks)+'</div>'+
    '<div class="meta">'+esc(sh.y)+' · '+sh.m+'分钟'+(ven?' · <span class="ven">'+esc(ven)+'</span>':'')+'</div>'+
  '</div>';
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function visibleShow(sh){
  if(starOnly&&!sh.s)return false;
  if(hideOff&&sh.o)return false;
  var q=document.getElementById("q").value.trim();
  if(q&&sh.n.indexOf(q)<0)return false;
  return true;
}
function sortedVenue(shows){
  var arr=shows.slice();
  arr.sort(function(a,b){
    var fa=firstTime(a),fb=firstTime(b);
    if(fa==null&&fb==null)return 0;if(fa==null)return 1;if(fb==null)return -1;
    return fa-fb;
  });
  return arr;
}
function renderVenues(){
  var html='<div class="area-title">'+esc(AREAS[cur].name)+' <span style="font-size:12px;color:#9a8d72;letter-spacing:1px">'+esc(AREAS[cur].sub)+'</span></div>';
  var any=false;
  AREAS[cur].venues.forEach(function(v){
    var rows="";
    sortedVenue(v.shows).forEach(function(sh){
      if(!visibleShow(sh))return;
      rows+=rowHtml(sh);
    });
    if(!rows)return;
    any=true;
    var on=v.shows.filter(visibleShow).length;
    html+='<div class="venue" data-v="'+esc(v.v)+'"><div class="venue-head"><span class="vname">'+esc(v.v)+'</span><span class="cnt">'+on+' 个节目</span></div>'+rows+'</div>';
  });
  document.getElementById("main").innerHTML=any?html:'<div class="empty">没有符合条件的节目，换个筛选条件试试～</div>';
}
function renderTimeline(){
  var html='<div class="area-title">'+esc(AREAS[cur].name)+' · 时间轴 <span style="font-size:12px;color:#9a8d72;letter-spacing:1px">'+esc(AREAS[cur].sub)+'</span></div>';
  var any=false;
  for(var h=8;h<=23;h++){
    var rows="";
    AREAS[cur].venues.forEach(function(v){
      v.shows.forEach(function(sh){
        if(!visibleShow(sh)||sh.o)return;
        sh.ts.forEach(function(t){
          var m=t2m(t);if(m==null)return;
          if(m>=h*60&&m<(h+1)*60)rows+=rowHtml(sh,v.v);
        });
      });
    });
    if(rows){any=true;html+='<div class="hour"><div class="hour-head"><span>'+pad(h)+':00 – '+pad(h+1)+':00</span><span class="hcnt">'+rows.split('row').length+' 场</span></div>'+rows+'</div>';}
  }
  document.getElementById("main").innerHTML=any?html:'<div class="empty">没有符合条件的节目，换个筛选条件试试～</div>';
}
function render(){
  if(qs.photo=="1"){ if(view=="venue")renderVenues(); else renderTimeline(); }
  else if(mode=="loc")renderLoc();
  else if(mode=="area")renderArea();
  else if(view=="venue")renderVenues(); else renderTimeline();
  if(qs.photo=="1"){
    var el=document.getElementById("main");
    el.innerHTML='<div class="ptitle"><div class="p1">⚔️ 万岁山武侠城 · 节目单</div><div class="p2">'+esc(AREAS[cur].name)+' · '+esc(AREAS[cur].sub)+'</div></div>'+el.innerHTML;
  }
  renderTabs(); renderNowbar();
}
function renderTabs(){
  var h="";
  AREAS.forEach(function(a,i){
    h+='<div class="tab'+(i==cur?" on":"")+'" onclick="cur='+i+';render()">'+esc(a.name)+'<small>'+esc(a.sub)+'</small></div>';
  });
  document.getElementById("tabs").innerHTML=h;
}
function toggleView(){
  view=(view=="venue")?"timeline":"venue";
  document.getElementById("bView").textContent=(view=="venue")?"📅 时间轴":"📍 按片区";
  render();
}
function toggleOff(){hideOff=!hideOff;document.getElementById("bOff").classList.toggle("on",hideOff);render()}
function toggleStar(){starOnly=!starOnly;document.getElementById("bStar").classList.toggle("on",starOnly);render()}
function renderNowbar(){
  var nm=NOW.getHours()*60+NOW.getMinutes(),now=[],soon=[];
  AREAS.forEach(function(a){
    a.venues.forEach(function(v){
      v.shows.forEach(function(sh){
        if(sh.o)return;
        sh.ts.forEach(function(t){
          var st=t2m(t);if(st==null)return;
          var en=st+sh.m;
          if(nm>=st&&nm<en)now.push(sh.n+"（"+v.v+"）");
          else if(nm<st&&st-nm<=30)soon.push(sh.n+"（"+v.v+"）"+t);
        });
      });
    });
  });
  var el=document.getElementById("nowbar");
  if(now.length||soon.length){
    var h='<b>🕐 '+pad(NOW.getHours())+":"+pad(NOW.getMinutes())+'</b> ';
    if(now.length)h+='<span class="tm">正在演出</span>'+now.slice(0,6).map(function(x){return '<span class="t">'+esc(x)+'</span>'}).join("")+(now.length>6?" 等"+now.length+"个":"");
    if(soon.length)h+='<span class="tm" style="margin-left:8px">30分钟内开始</span>'+soon.slice(0,3).map(function(x){return '<span class="soon">'+esc(x)+'</span>'}).join("")+(soon.length>3?" 等"+soon.length+"个":"");
    el.innerHTML=h;el.style.display="block";
  }else{el.style.display="none"}
  var bn=document.getElementById("bNow");
  if(now.length&&view=="venue"&&mode=="browse"){bn.style.display="block"}else{bn.style.display="none"}
}
function scrollNow(){
  var rows=document.querySelectorAll(".chip.now");
  if(!rows.length){alert("当前没有正在演出的节目");return}
  rows[0].scrollIntoView({behavior:"smooth",block:"center"});
}
/* ===== 地点查询：当前节目 + 下一场 ===== */
var mode="loc",locSel=null;
function fmt(m){return pad(Math.floor(m/60))+":"+pad(m%60)}
function nowNext(shows){
  var nm=NOW.getHours()*60+NOW.getMinutes(),now=null,next=null;
  shows.forEach(function(sh){
    if(sh.o)return;
    sh.ts.forEach(function(t){
      var st=t2m(t);if(st==null)return;
      var en=st+sh.m;
      if(nm>=st&&nm<en){if(!now||st>now.st)now={sh:sh,st:st,en:en,t:t}}
      if(nm<st){if(!next||st<next.st)next={sh:sh,st:st,t:t}}
    });
  });
  return {now:now,next:next};
}
function locCardHtml(v){
  var nn=nowNext(v.shows),nm=NOW.getHours()*60+NOW.getMinutes();
  var h='<div class="lchead"><span>🕐 现在 '+fmt(nm)+'</span><span class="lcven">'+esc(v.v)+'</span></div>';
  if(nn.now){
    var pct=Math.max(3,Math.min(100,Math.round((nm-nn.now.st)/(nn.now.en-nn.now.st)*100)));
    h+='<div class="lcnow"><div class="lc-l">▶ 正在演出</div><div class="lc-n">'+esc(nn.now.sh.n)+'</div>'+
       '<div class="lc-m">'+esc(nn.now.sh.y)+' · '+nn.now.sh.m+'分钟 · 至 '+fmt(nn.now.en)+' 结束'+(isTBD(nn.now.t)?" · 待定":"")+'</div>'+
       '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }else{
    h+='<div class="lcnow idle"><div class="lc-l">▶ 当前时段</div><div class="lc-n">暂无演出</div><div class="lc-m">休息时段，没有节目在进行</div></div>';
  }
  if(nn.next){
    var diff=nn.next.st-nm,dtxt;
    if(diff<=1)dtxt="马上开始";
    else if(diff<60)dtxt="还有 "+diff+" 分钟开始";
    else dtxt="还有 "+Math.floor(diff/60)+" 小时 "+pad(diff%60)+" 分开始";
    h+='<div class="lcnext"><div class="lc-l">⏭ 下一场</div><div class="lc-n">'+esc(nn.next.sh.n)+'</div>'+
       '<div class="lc-m">'+fmt(nn.next.st)+' 开始 · '+dtxt+(isTBD(nn.next.t)?"（待定）":"")+'</div></div>';
  }else{
    h+='<div class="lcnext idle"><div class="lc-l">⏭ 今日演出</div><div class="lc-n">已全部结束</div><div class="lc-m">明天请早 🏮</div></div>';
  }
  return h;
}
function pickerHtml(){
  var q=document.getElementById("q").value.trim(),h="";
  AREAS.forEach(function(a,ai){
    var btns="";
    a.venues.forEach(function(v,vi){
      if(q&&!(v.v.indexOf(q)>=0||v.shows.some(function(s){return s.n.indexOf(q)>=0})))return;
      var on=locSel&&locSel.a==ai&&locSel.i==vi;
      btns+='<button class="pv'+(on?' on':'')+'" onclick="locSel={a:'+ai+',i:'+vi+'};render()">'+esc(v.v)+'</button>';
    });
    if(btns)h+='<div class="pg-h">'+esc(a.name)+'</div><div class="pg">'+btns+'</div>';
  });
  return h;
}
function renderLoc(){
  var html="";
  if(locSel){
    var v=AREAS[locSel.a].venues[locSel.i];
    html+='<div class="loccard" id="loccard">'+locCardHtml(v)+'</div>';
    html+='<div class="area-title">📍 '+esc(v.v)+' · 全天场次</div>';
    var nn=nowNext(v.shows),marks={now:nn.now?nn.now.st:null,next:nn.next?nn.next.st:null};
    var list="";
    sortedVenue(v.shows).forEach(function(sh){
      if(!visibleShow(sh))return;
      list+=rowHtml(sh,null,marks);
    });
    html+=list?'<div class="venue">'+list+'</div>':'<div class="empty">该地点今日没有可看的演出</div>';
  }else{
    html+='<div class="hint">👆 点下面选你所在的位置<br>马上告诉你：<b>正在演什么、下一场几点开始</b></div>';
  }
  html+='<div class="area-title">选地点（随时可换）</div>'+pickerHtml();
  document.getElementById("main").innerHTML=html;
}
function updateLocCard(){
  if(!locSel)return;
  var el=document.getElementById("loccard");
  if(el)el.innerHTML=locCardHtml(AREAS[locSel.a].venues[locSel.i]);
}
function setMode(m){
  mode=m;
  ["bLoc","bArea","bList"].forEach(function(id){
    document.getElementById(id).classList.toggle("on",(id=="bLoc"&&m=="loc")||(id=="bArea"&&m=="area")||(id=="bList"&&m=="browse"));
  });
  document.getElementById("bView").style.display=(m=="browse")?"":"none";
  document.getElementById("q").placeholder=(m=="browse")?"🔍 搜索节目名称…":"🔍 搜节目或地点…";
  render();
}
/* ===== 区域实况：全区当前演出 + 下一场推荐 ===== */
function areaNowList(){
  var nm=NOW.getHours()*60+NOW.getMinutes(),out=[];
  AREAS[cur].venues.forEach(function(v){
    v.shows.forEach(function(sh){
      if(!visibleShow(sh))return;
      sh.ts.forEach(function(t){
        var st=t2m(t);if(st==null)return;
        var en=st+sh.m;
        if(nm>=st&&nm<en)out.push({sh:sh,ven:v.v,st:st,en:en,t:t});
      });
    });
  });
  out.sort(function(a,b){return a.en-b.en});
  return out;
}
function areaNextList(){
  var nm=NOW.getHours()*60+NOW.getMinutes(),out=[];
  AREAS[cur].venues.forEach(function(v){
    v.shows.forEach(function(sh){
      if(!visibleShow(sh))return;
      sh.ts.forEach(function(t){
        var st=t2m(t);if(st==null)return;
        if(nm<st)out.push({sh:sh,ven:v.v,st:st,t:t});
      });
    });
  });
  out.sort(function(a,b){return a.st-b.st});
  return out;
}
function renderArea(){
  var nm=NOW.getHours()*60+NOW.getMinutes();
  var html='<div class="area-title">🎪 '+esc(AREAS[cur].name)+' · 区域实况 <span style="font-size:12px;color:#9a8d72;letter-spacing:1px">'+esc(AREAS[cur].sub)+'</span></div>';
  html+='<div class="areabar">🕐 现在 '+fmt(nm)+'</div>';
  var now=areaNowList(),next=areaNextList();
  html+='<div class="pg-h">▶ 正在演出 · 同一时间有 '+now.length+' 场</div>';
  if(now.length){
    now.forEach(function(it){
      var pct=Math.max(3,Math.min(100,Math.round((nm-it.st)/(it.en-it.st)*100)));
      var left=it.en-nm;
      html+='<div class="ac"><div class="ac-n">'+(it.sh.s?'<span class="star">★</span>':'')+esc(it.sh.n)+'</div>'+
            '<div class="ac-m">📍'+esc(it.ven)+' · 至 '+fmt(it.en)+' 结束 · 还剩 '+left+' 分钟'+(isTBD(it.t)?" · 待定":"")+'</div>'+
            '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
    });
  }else{
    html+='<div class="hint">当前时段 '+esc(AREAS[cur].name)+' 没有正在演出的节目<br>看看下一场去哪里 👇</div>';
  }
  html+='<div class="pg-h">⏭ 下一场 · 推荐去哪里看</div>';
  if(next.length){
    var rec=next[0],diff=rec.st-nm,dtxt;
    if(diff<=1)dtxt="马上开始";else if(diff<60)dtxt="还有 "+diff+" 分钟";else dtxt="还有 "+Math.floor(diff/60)+" 小时 "+pad(diff%60)+" 分";
    html+='<div class="rec"><div class="rc-l">推荐 · '+fmt(rec.st)+' 开始 · '+dtxt+'</div>'+
          '<div class="rc-n">'+(rec.sh.s?'<span class="star">★</span>':'')+esc(rec.sh.n)+'</div>'+
          '<div class="rc-m">📍 去 <b>'+esc(rec.ven)+'</b> · '+esc(rec.sh.y)+' · '+rec.sh.m+'分钟'+(isTBD(rec.t)?" · 待定":"")+'</div></div>';
    var rest=next.slice(1).filter(function(x){return x.st-nm<=60});
    if(rest.length){
      html+='<div class="pg-h">接下来 1 小时内还有 '+rest.length+' 场</div><div class="venue">';
      rest.forEach(function(it){
        var cls=it.st-nm<=30?" soon":"";
        html+='<div class="row"><div class="nm">'+(it.sh.s?'<span class="star">★</span>':'')+esc(it.sh.n)+'</div>'+
              '<div class="chips"><span class="chip '+cls+'">'+fmt(it.st)+'</span></div>'+
              '<div class="meta">📍'+esc(it.ven)+' · '+esc(it.sh.y)+'</div></div>';
      });
      html+='</div>';
    }
  }else{
    html+='<div class="hint">今天 '+esc(AREAS[cur].name)+' 的演出已全部结束 🏮<br>顶部可以切换到其他区看看</div>';
  }
  document.getElementById("main").innerHTML=html;
}
document.getElementById("q").addEventListener("input",render);
var qs={};location.search.replace(/[?&]([^=]+)=([^&]*)/g,function(_,k,v){qs[decodeURIComponent(k)]=decodeURIComponent(v)});
if(qs.photo=="1"){document.body.classList.add("photo");if(qs.area!=null)cur=parseInt(qs.area,10)||0;hideOff=false;}
NOW=new Date();
render();
setInterval(function(){
  NOW=new Date();renderNowbar();
  if(mode=="loc"&&locSel)updateLocCard();
  else if(mode=="area"){var s=window.scrollY;renderArea();window.scrollTo(0,s);}
},30000);
</script>
